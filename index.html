    <script>
      window.global = window;
      // Polyfill process for Node-oriented dependencies that reference it at runtime.
      // Must run BEFORE the app module so typeof guards in libraries work correctly.
      if (typeof window.process === 'undefined') {
        window.process = { env: {} };
      } else if (!window.process.env) {
        window.process.env = {};
      }
      // Safety net: some bundled dependencies may reference a bare `env` variable
      // after minification or incorrect tree-shaking on certain build hosts.
      if (typeof window.env === 'undefined') {
        window.env = {};
      }

      // Keep David comfortably audible without the distant/too-quiet effect.
      // This is applied only to audio elements at playback time.
      if (typeof window.HTMLMediaElement !== 'undefined') {
        const originalPlay = window.HTMLMediaElement.prototype.play;
        window.HTMLMediaElement.prototype.play = function (...args) {
          if (typeof window.HTMLAudioElement !== 'undefined' && this instanceof window.HTMLAudioElement) {
            this.volume = 0.82;
          }
          return originalPlay.apply(this, args);
        };
      }
    </script>
